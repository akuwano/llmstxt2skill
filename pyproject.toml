[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmstxt2skill"
version = "0.1.0"
description = "Convert llms.txt to Claude Code Skill format"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
llmstxt2skill = "llmstxt2skill.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llmstxt2skill"]

[tool.hatch.build.targets.sdist]
include = ["src/llmstxt2skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
